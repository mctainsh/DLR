<head>
	<meta charset="utf-8" />

	<title>BlazorDLR</title>
	<base href="/" />
	<link rel="stylesheet" href="_content/BlazorDLR.Shared/lib/bootstrap/dist/css/bootstrap.min.css" />
	<!-- Vendored, not a CDN. The phone is the host most likely to be offline, and a nav
	     made of icons with no font is a nav made of empty squares. -->
	<link rel="stylesheet" href="_content/BlazorDLR.Shared/lib/fontawesome/css/all.min.css" />
	<link rel="stylesheet" href="_content/BlazorDLR.Shared/app.css" />
	<link rel="stylesheet" href="app.css" />
	<link rel="stylesheet" href="BlazorDLR.styles.css" />
	<link rel="icon" href="data:,">
	<!-- Publishes which edge the camera cutout is on as `data-notch`, because in landscape
	     iOS reports the same side inset on both edges and the nav rail only wants clearance
	     on the one that has a cutout. In <head> and not deferred: it has to have run before
	     the first paint, or the rail lands in the wrong place and slides. -->
	<script src="_content/BlazorDLR.Shared/safe-area.js"></script>
</head>

<body>

	<div class="status-bar-safe-area"></div>

	<div id="app">Loading...</div>

	<script src="_framework/blazor.webview.js" autostart="false"></script>

</body>
