# The gates from §14.4 and §14.6.3, as a build failure rather than a convention.
#
# `pull_request`, never `pull_request_target`. The difference is not stylistic: the
# latter runs the *base* branch's workflow with the repository's secrets available to
# code the fork controls. This repository is public, so that is the one mistake here
# with no clean recovery.
#
# No job below reads a secret, which is what makes a fork pull request run the whole
# suite. That is not a concession — §10.4 already put every test on a throwaway
# PostgreSQL container and a fake IEmailSender, so there was nothing to withhold.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and inherited by every job. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same pull request cancels the first. Not on main: those runs
# are the record of what was released.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # No version here: global.json pins the SDK, and naming it twice means one of
      # the two is eventually wrong.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Web/DLR.sln

      - name: Build
        run: dotnet build Web/DLR.sln --configuration Release --no-restore

      # Docker is present on the hosted runner, which is all Testcontainers needs.
      - name: Test
        run: >
          dotnet test Web/DLR.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts/test-results

      # Runs even after a test failure: a red suite and a formatting slip are two
      # separate things to fix, and finding out about them one round trip at a time
      # is the thing CI is supposed to prevent.
      - name: Format
        if: always()
        run: dotnet format Web/DLR.sln --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The restore is load-bearing. nuget-license reads project.assets.json, so
      # without it the scan reports the previous dependency graph and can pass on a
      # package added in this very pull request.
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Web/DLR.sln

      # Fails on a licence outside the allow-list *and* on one it cannot determine.
      # The second half is the point: a package declaring its licence as a file
      # rather than an expression is not a package with no licence, it is a package
      # nobody has read. Run from the repository root — that is what makes the two
      # build/licences/ paths resolve (§3).
      - name: Scan the transitive package graph
        run: >
          dotnet nuget-license
          --input Web/DLR.sln
          --include-transitive
          --allowed-license-types build/licences/allowed-licences.json
          --licenseurl-to-license-mappings build/licences/licence-url-mappings.json

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Every commit in the range has to be readable, so the shallow default will
      # not do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checked in-repo rather than with a third-party action: this job exists to
      # assert something about provenance, and borrowing someone else's code to do
      # it is the wrong shape. §14.6.4.
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"

            if git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>$"; then
              continue
            fi

            echo "::error::${sha} is not signed off — ${subject}"
            echo "  author: ${author}"
            missing=$((missing + 1))
          done < <(git rev-list "${BASE}..${HEAD}")

          if [ "$missing" -gt 0 ]; then
            echo
            echo "${missing} commit(s) without a Signed-off-by line."
            echo "Fix the branch with: git rebase --signoff main"
            echo "See CONTRIBUTING.md — the DCO is a statement about provenance,"
            echo "so use a real name and a reachable email."
            exit 1
          fi

          echo "All commits signed off."

  # The deployment is code too, and it breaks the same way everything else does — one
  # missing package in the runtime stage, one path that stopped existing. Building the
  # image on every pull request is what makes that a red check rather than a failed
  # deploy at the end of an evening (§9).
  #
  # Built, never pushed. Publishing needs a registry credential, and §14.4's rule is
  # that no job a fork can trigger reads a secret.
  image:
    name: Build the server image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history: SourceLink reads the commit out of it and /api/v1/about hands it
      # back, which is an AGPL §13 obligation rather than a nicety (§14.6.2). The
      # default shallow clone produces a server that cannot say which commit it is.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the image
        run: docker build --file deploy/Dockerfile --tag dlr-server:ci .

      # The image starting is not the same as the image working. This is the one check
      # that would have caught a runtime stage missing the native library SkiaSharp
      # needs, or a blob mount point owned by root.
      - name: Start it against a throwaway PostgreSQL
        run: |
          set -euo pipefail

          docker network create dlr-ci

          docker run --detach --name pg --network dlr-ci \
            --env POSTGRES_DB=dlr --env POSTGRES_USER=dlr --env POSTGRES_PASSWORD=ci \
            --health-cmd "pg_isready --username=dlr --dbname=dlr" \
            --health-interval 3s --health-retries 20 \
            postgres:17-alpine

          until [ "$(docker inspect --format '{{.State.Health.Status}}' pg)" = healthy ]; do
            sleep 2
          done

          docker run --rm --network dlr-ci \
            --env 'ConnectionStrings__Dlr=Host=pg;Database=dlr;Username=dlr;Password=ci' \
            dlr-server:ci --migrate

          docker run --detach --name server --network dlr-ci \
            --env 'ConnectionStrings__Dlr=Host=pg;Database=dlr;Username=dlr;Password=ci' \
            --env 'Auth__SigningKey=ci-only-key-long-enough-for-hs256-and-not-a-secret' \
            --env Blobs__RootPath=/blobs \
            dlr-server:ci

      # /healthz judges the schema and the disk as well as the process (§9), so a green
      # answer here means the migration step ran and the blob volume is writable — the
      # two things a fresh deployment gets wrong.
      - name: Wait for it to report healthy
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if docker run --rm --network dlr-ci curlimages/curl:latest \
              --fail --silent http://server:8080/healthz; then
              echo
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi

            sleep 2
          done

          echo "::error::The server never reported healthy."
          docker logs server
          exit 1
